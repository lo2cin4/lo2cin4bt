name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plotter/web/package-lock.json

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Install frontend dependencies
        working-directory: plotter/web
        run: npm ci

      - name: Build frontend
        working-directory: plotter/web
        run: npm run build

      - name: Install Playwright browser
        working-directory: plotter/web
        run: npx playwright install --with-deps chromium

      - name: Test Rust core
        run: cargo +1.96.0 test --manifest-path rust/lo2cin4bt_core/Cargo.toml --locked --quiet

      - name: Build Rust release service
        run: cargo +1.96.0 build --manifest-path rust/lo2cin4bt_core/Cargo.toml --release --bins --locked

      - name: Type and lint gates
        run: |
          uv run --locked --exact --group dev python -m mypy
          uv run --locked --exact --group dev python -m ruff check .

      - name: Check repository setup
        run: uv run --locked --exact --group dev python scripts/doctor.py --require-frontend-build

      - name: Run complete Python, acceptance, and golden suite
        run: uv run --locked --exact --group dev python -m pytest -q

      - name: Run production frontend routes
        run: |
          uv run --locked --exact --group dev python main.py --no-browser >/tmp/lo2cin4bt-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:2424/api/app/health >/dev/null; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/lo2cin4bt-app.log
              exit 1
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:2424/api/app/health
          npm --prefix plotter/web run test:e2e:production

      - name: Verify deterministic generated contracts
        run: |
          uv run --locked --exact --group dev python -m backtester.ops.export
          git diff --exit-code -- app/contracts/generated/op-registry-v1.json
