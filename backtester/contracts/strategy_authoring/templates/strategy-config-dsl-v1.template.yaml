schema_version: strategy_config_dsl.v1
source_layer: strategy_config_dsl
template_only: true
do_not_run: true
platform:
  strategy_profile_id: selection_timing_portfolio
  strategy_preset_id: single_asset_signal

intent:
  plain_language: "Buy QQQ when RSI(14) is below 20 and exit when RSI(14) is above 80."
  local_research_only: true

data:
  provider: yfinance
  bar_time:
    schema_version: bar_time_contract.v1
    contract_id: lo2cin4bt.bar_time_contract.v1
    session_model:
      calendar_id: XNAS
      timezone: America/New_York
      session_scope: regular
      session_label_policy: exchange_local_date
      non_session_bar_policy: reject
    timestamp_model:
      time_standard: UTC
      precision: nanosecond
      clock: historical_available_time
      ordering: available_time_then_event_time_then_external_execution_sequence_then_lifecycle_stage_then_stream_id_then_source_sequence
    price_model:
      price_basis: split_dividend_adjusted
      corporate_action_policy: provider_applied
    streams:
      - stream_id: execution_daily
        role: execution
        source:
          kind: external
          provider_id: yfinance
        bar_spec:
          aggregation: time
          step: 1
          unit: day
          price_type: last
          alignment: session_open
        timestamp_semantics:
          timestamp_convention: bar_close
          interval_boundary: left_open_right_closed
          bar_open_time_column: bar_open_timestamp
          bar_close_time_column: bar_close_timestamp
          available_time_column: available_timestamp
          session_label_column: session_label
          availability_policy: bar_close
  stream_binding:
    execution_stream_id: execution_daily
    decision_stream_id: execution_daily
  start_date: "2015-01-01"
  benchmark: QQQ

universe:
  symbols:
    - QQQ
  universe_policy: explicit_symbols
  survivorship_policy: static_user_supplied

computed_fields:
  - name: rsi_14
    op: indicator.rsi
    inputs:
      source: close
    params:
      period: 14
    output: value
    availability: after_source_bar_close

signals:
  entry:
    all:
      - field: rsi_14
        op: lt
        value: 20
  exit:
    any:
      - field: rsi_14
        op: gt
        value: 80

selection:
  rank_by: null
  eligible: null
  top_n: 1
  rank_order: descending

allocation:
  method: equal_weight
  position_limit: 1.0
  cash_policy: hold_cash_when_flat

rebalance:
  trigger:
    op: target.change

fill_model:
  entry_timing: next_session_open
  exit_timing: next_session_open
  cost_model:
    commission_rate: 0.001
  slippage_model:
    bps: 5

risk:
  allow_short: false
  max_gross_exposure: 1.0

validation:
  workflow: single_backtest
  oracle_test_required_for_new_block: true
